name: Site check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.1.0
        with:
          python-version: '3.12'
      - name: Validate HTML
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Validator(HTMLParser):
              pass

          for path in Path('.').rglob('*.html'):
              Validator().feed(path.read_text(encoding='utf-8'))
              print(f'Validated {path}')
          PY
      - name: Check local asset references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          pattern = re.compile(r'''(?:src|href)=["']([^"']+)["']''', re.I)
          ignored_prefixes = ('http://', 'https://', '//', '#', 'mailto:', 'tel:', 'data:', 'javascript:')
          excluded_roots = (Path('documentation'),)
          missing = []

          for html in root.rglob('*.html'):
              if any(excluded in html.parents for excluded in excluded_roots):
                  continue
              text = html.read_text(encoding='utf-8')
              for target in pattern.findall(text):
                  target = target.split('?', 1)[0].split('#', 1)[0]
                  if not target or target.startswith(ignored_prefixes):
                      continue
                  candidate = root / target.lstrip('/') if target.startswith('/') else html.parent / target
                  if not candidate.exists():
                      missing.append(f'{html}: {target}')

          if missing:
              print('Missing local references:')
              print('\n'.join(missing))
              raise SystemExit(1)
          print('Local asset references look valid.')
          PY
      - name: Check internal HTML links
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          pattern = re.compile(r'''href=["']([^"']+)["']''', re.I)
          ignored_prefixes = ('http://', 'https://', '//', '#', 'mailto:', 'tel:', 'data:', 'javascript:')
          excluded_roots = (Path('documentation'),)
          missing = []

          for html in root.rglob('*.html'):
              if any(excluded in html.parents for excluded in excluded_roots):
                  continue
              text = html.read_text(encoding='utf-8')
              for target in pattern.findall(text):
                  target = target.split('?', 1)[0].split('#', 1)[0]
                  if not target or target.startswith(ignored_prefixes):
                      continue
                  candidate = root / target.lstrip('/') if target.startswith('/') else html.parent / target
                  if candidate.is_dir():
                      candidate = candidate / 'index.html'
                  if candidate.suffix.lower() != '.html':
                      continue
                  if not candidate.exists():
                      missing.append(f'{html}: {target}')

          if missing:
              print('Missing internal HTML links:')
              print('\n'.join(missing))
              raise SystemExit(1)
          print('Internal HTML links look valid.')
          PY
